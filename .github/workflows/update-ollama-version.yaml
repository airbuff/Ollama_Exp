
name: Update Ollama Version

on:
  schedule:
    - cron: '43 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch Latest Ollama Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG=$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ollama/ollama/releases/latest \
            | jq -er '.tag_name')

          echo "VERSION=$LATEST_TAG" >> "$GITHUB_ENV"
          echo "Latest Ollama version: $LATEST_TAG"

      - name: Update README.md
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          readme = Path("README.md")

          content = readme.read_text(encoding="utf-8")

          updated = f"- Ollama {version}+ installed"
          pattern = r"(?m)^- Ollama v[^\r\n]*$"

          if re.search(pattern, content):
              content = re.sub(
                  pattern,
                  lambda _: updated,
                  content
              )
          else:
              content = content.rstrip() + "\n\n" + updated + "\n"

          readme.write_text(content, encoding="utf-8")
          PY

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Ollama version already up to date."
            exit 0
          fi

          git commit -m \
            "chore: update Ollama to ${{ env.VERSION }}"

          git push origin HEAD:main
