name: Update Ollama Version

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest Ollama Version
        id: ollama
        run: |
          # Pulls the latest release tag (e.g., v0.5.1) from the official Ollama repo
          LATEST_TAG=$(curl -s https://github.com | jq -r '.tag_name')
          echo "VERSION=$LATEST_TAG" >> $GITHUB_ENV

      - name: Update README.md
        run: |
          # Dynamically replaces any line starting with "- Ollama v" with the new version
          sed -i "s/- Ollama v.*/- Ollama ${{ env.VERSION }}+ installed/g" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          
          # Only commit if the version actually changed
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update Ollama prerequisite to ${{ env.VERSION }}"
            git push
          else
            echo "Ollama version is already up to date."
          fi
